<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BDPedidos | Bakery Dreams</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" class="login-shell">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">BD</div>
      <h1>BDPedidos</h1>
      <p>Control de pedidos y finanzas.</p>
      <label>Usuario<input id="username" autocomplete="username" required></label>
      <label>Contrase&ntilde;a<input id="password" type="password" autocomplete="current-password" required></label>
      <p id="loginError" class="error" role="alert"></p>
      <button class="primary" type="submit">Iniciar sesi&oacute;n</button>
    </form>
  </section>
  <div id="app" class="app hidden">
    <header class="mobile-topbar">
      <button id="mobileMenu" class="menu-button" aria-label="Abrir men&uacute;">&#9776;</button>
      <strong>BDPedidos</strong>
      <button id="topLogout" class="text-button">Salir</button>
    </header>
    <aside id="sidebar">
      <div class="side-brand"><div class="brand-mark">BD</div><div><strong>BDPedidos</strong><span id="sidebarUser">Bakery Dreams</span></div></div>
      <nav>
        <button class="nav-item active" data-view="dashboard"><span>&#9638;</span> Resumen</button>
        <button class="nav-item" data-view="orders"><span>+</span> Recepci&oacute;n de pedidos</button>
        <button class="nav-item" data-view="finance"><span>&#36;</span> Finanzas</button>
        <button class="nav-item" data-view="catalog"><span>&#9636;</span> Cat&aacute;logo</button>
      </nav>
      <div class="side-bottom"><span id="sidebarRole"></span><button id="logout" class="text-button">Cerrar sesi&oacute;n</button></div>
    </aside>
    <main>
      <header class="desktop-header">
        <div><p class="eyebrow">Panel de control</p><h2 id="viewTitle">Resumen general</h2></div>
        <div class="header-actions"><span id="currentUserLabel"></span><span id="today"></span><div id="avatar" class="avatar">B</div></div>
      </header>
      <section id="content"></section>
    </main>
  </div>
  <script src="app.js?v=20260822-login-required"></script>
  <script src="periods.js?v=20260822-weekly-periods"></script>
</body>
</html>
